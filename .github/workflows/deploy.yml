# Deploy ActView 文档到 GitHub Pages
# 触发：push 到 main 分支，或手动 workflow_dispatch
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # CI 环境没有本地 file: 依赖（C:\code\vitepress），
      # 改用 npm registry 上发布的 @actview/press；
      # --no-frozen-lockfile：lockfile 中 @actview/press 是 file: 引用，需重新解析
      - name: Switch @actview/press to npm registry
        run: |
          sed -i 's#"@actview/press": "file:C:/code/vitepress"#"@actview/press": "^1.0.1"#' package.json
          grep '"@actview/press"' package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
